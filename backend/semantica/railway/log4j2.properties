status = warn
name = FinanzasFuseki

appender.stdout.type = Console
appender.stdout.name = STDOUT
appender.stdout.target = SYSTEM_OUT

appender.stdout.layout.type = PatternLayout
appender.stdout.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c{1} - %m%n

rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = STDOUT

logger.server.name = org.apache.jena.fuseki.Server
logger.server.level = info

logger.request.name = org.apache.jena.fuseki.Request
logger.request.level = off

logger.fuseki.name = org.apache.jena.fuseki.Fuseki
logger.fuseki.level = off

logger.arq.name = org.apache.jena.arq.exec
logger.arq.level = off